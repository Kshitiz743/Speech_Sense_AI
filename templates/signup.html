<!DOCTYPE html>
<html>

<head>

<title>Sign Up | SpeechSense AI</title>

<link rel="stylesheet"
href="{{url_for('static',
filename='css/style.css')}}">

</head>


<body>


<div class="auth-container">


<h1>

SpeechSense AI

</h1>


<h3>

Create Your Account

</h3>


<form action="/signup"

method="POST">


<input type="text"

name="username"

placeholder="Username"

required>



<input type="email"

name="email"

placeholder="Email Address"

required>



<input type="password"

name="password"

placeholder="Password"

required>



<button class="signup-btn">

SIGN UP

</button>



</form>



<p>

Already have an account?

</p>



<a href="/login">

LOGIN HERE

</a>



</div>


</body>

</html>
